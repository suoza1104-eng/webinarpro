<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WebnarPRO — Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link rel="stylesheet" href="/css/styles.css?v=14">
<style>
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  .sala-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;}
  .sala-error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;text-align:center;padding:20px;}
  .reg-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:999;padding:16px;}
  .reg-screen.open{display:flex;}
  .reg-card{width:100%;max-width:380px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:32px 28px;text-align:center;}
  .reg-logo{width:52px;height:52px;border-radius:12px;background:var(--yellow);color:#0a0a0a;font-family:var(--font-display);font-size:22px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .reg-title{font-family:var(--font-display);font-size:17px;margin-bottom:4px;}
  .reg-sub{color:var(--text-dim);font-size:12.5px;margin-bottom:22px;}
  .reg-field{margin-bottom:12px;text-align:left;}
  .reg-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .reg-badge{background:var(--bg-elev-3);border-radius:6px;padding:8px 12px;font-size:10.5px;font-weight:700;color:var(--text-dim);margin-bottom:16px;}
  .sale-toast{position:fixed;left:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .sale-toast .sale-item{animation:saleIn .25s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  @keyframes saleIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .yt-wrap{position:relative;width:100%;height:100%;}
  .yt-controls{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 8px;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));
    opacity:0;transition:opacity .18s;pointer-events:none;}
  .yt-wrap:hover .yt-controls, .yt-wrap.yt-show .yt-controls{opacity:1;pointer-events:auto;}
  .yt-scrub{position:relative;height:14px;display:flex;align-items:center;cursor:pointer;margin-bottom:4px;}
  .yt-scrub-track{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.25);}
  .yt-scrub-played{position:absolute;left:0;height:4px;border-radius:2px;background:var(--red);width:0;}
  .yt-scrub-thumb{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--red);
    transform:translate(-50%,-50%);left:0;box-shadow:0 0 0 3px rgba(255,255,255,.15);}
  .yt-controls-row{display:flex;align-items:center;gap:10px;color:#fff;}
  .yt-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:16px;padding:4px;line-height:1;display:flex;align-items:center;}
  .yt-btn svg{width:20px;height:20px;}
  .yt-time{font-family:var(--font-mono);font-size:11px;color:#e8e8e8;white-space:nowrap;}
  .yt-live-btn{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:10.5px;font-weight:800;
    letter-spacing:.4px;padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .yt-live-btn::before{content:'';width:7px;height:7px;border-radius:50%;background:#888;}
  .yt-live-btn.at-edge{background:rgba(255,60,60,.18);}
  .yt-live-btn.at-edge::before{background:var(--red);}
  .yt-speed-wrap{position:relative;}
  .yt-speed-btn{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:11px;font-weight:700;
    padding:5px 9px;border-radius:4px;cursor:pointer;font-family:var(--font-mono);}
  .yt-speed-menu{position:absolute;bottom:32px;right:0;background:#181818;border:1px solid #333;border-radius:6px;
    padding:4px;display:none;min-width:64px;}
  .yt-speed-menu.open{display:block;}
  .yt-speed-menu button{display:block;width:100%;background:none;border:none;color:#fff;font-size:11.5px;
    padding:6px 10px;text-align:left;border-radius:4px;cursor:pointer;font-family:var(--font-mono);}
  .yt-speed-menu button:hover{background:rgba(255,255,255,.1);}
  .yt-speed-menu button.sel{color:var(--yellow);}
  .yt-speed-menu button:disabled{opacity:.35;cursor:not-allowed;}
  .yt-vol-wrap{display:flex;align-items:center;}
  .yt-volume{width:64px;accent-color:#fff;cursor:pointer;margin-left:6px;}
  @media (hover:none){
    .yt-vol-wrap .yt-volume{display:none;}
    /* sem mouse não tem hover de verdade — controles maiores e fáceis de acertar com o dedo */
    .yt-wrap, .yt-controls, .yt-scrub, .yt-btn, .yt-live-btn, .yt-speed-btn, .yt-quality-btn{touch-action:manipulation;}
    .yt-controls{padding:28px 14px 14px;}
    .yt-scrub{height:28px;margin-bottom:0;}
    .yt-scrub-thumb{width:18px;height:18px;box-shadow:0 0 0 4px rgba(255,255,255,.18);}
    .yt-btn{padding:9px;}
    .yt-btn svg{width:24px;height:24px;}
    .yt-live-btn{padding:9px 13px;font-size:12px;}
    .yt-speed-btn{padding:9px 13px;font-size:12.5px;}
    .yt-quality-btn{padding:9px;}
    .yt-quality-btn svg{width:22px;height:22px;}
  }

  .reopen-checkout-btn{display:none;width:calc(100% - 28px);margin:12px 14px 0;padding:10px;border:none;border-radius:8px;
    background:var(--yellow);color:#0a0a0a;font-weight:800;font-size:13px;cursor:pointer;}
  .reopen-checkout-btn.blink-show{display:block;animation:reopenBlink 1.1s ease-in-out infinite;}
  @keyframes reopenBlink{0%,100%{opacity:1;}50%{opacity:.45;}}

  .offer-overlay{position:fixed;inset:0;z-index:700;background:#000;display:flex;flex-direction:row-reverse;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s;}
  .offer-overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease;}
  .offer-pip{position:relative;background:#000;flex:0 0 auto;cursor:pointer;}
  .offer-pip video{width:100%;height:100%;object-fit:contain;}
  .offer-panel{flex:1 1 auto;background:#fff;position:relative;overflow:auto;opacity:1;transition:opacity .22s ease;}
  .offer-panel.fading{opacity:0;}
  .offer-panel iframe{width:100%;height:100%;border:0;display:block;}
  .offer-close-btn{position:absolute;top:14px;left:14px;z-index:20;width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(0,0,0,.75);color:#fff;font-size:22px;line-height:1;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.4);}
  .offer-card{max-width:520px;margin:0 auto;padding:44px 24px;color:#111;text-align:center;}
  .offer-card img{width:100%;border-radius:10px;margin-bottom:18px;display:block;}
  .offer-card .offer-title{font-weight:700;font-size:18px;margin-bottom:10px;}
  .offer-card .offer-original{font-size:14px;color:#888;text-decoration:line-through;margin-bottom:4px;}
  .offer-card .offer-price{font-size:34px;font-weight:800;color:#111;margin-bottom:6px;}
  .offer-card .offer-note{font-size:13px;color:#888;margin-bottom:26px;}
  .offer-card button{width:100%;padding:16px;border:none;border-radius:10px;font-weight:800;font-size:16px;color:#fff;cursor:pointer;}
  @media (min-width:901px){
    .offer-pip{width:min(26vw,360px);aspect-ratio:16/9;}
    .offer-pip.pip-size-pequeno{width:min(16vw,220px);}
    .offer-pip.pip-size-grande{width:min(36vw,500px);}
  }
  @media (max-width:900px){
    .offer-overlay{flex-direction:column;}
    .offer-pip{position:absolute;bottom:14px;left:12px;width:130px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);z-index:15;}
    .offer-pip.pip-size-pequeno{width:90px;}
    .offer-pip.pip-size-grande{width:180px;}
    .offer-panel{flex:1 1 auto;width:100%;height:100%;}
    .offer-card{padding:36px 20px;}
  }

  /* ===================== BADGES DE AO VIVO / REPLAY + ESPECTADORES ===================== */
  .pub-main{position:relative;}
  .pub-video-badges{position:absolute;top:14px;left:16px;z-index:6;display:none;align-items:center;gap:8px;}
  .pub-video-badges.show{display:flex;}
  .pub-live-pill{background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;
    padding:6px 11px 6px 9px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .pub-live-pill svg{width:13px;height:13px;}
  .pub-live-pill.is-replay{background:var(--red);}
  .pub-viewer-pill{background:rgba(255,255,255,.95);color:#111;font-size:11px;font-weight:700;
    padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .pub-viewer-pill svg{width:14px;height:14px;}

  /* ===================== TELA DE CAPA (CLIQUE PARA ASSISTIR) ===================== */
  .pub-cover{position:relative;width:100%;height:100%;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;text-align:center;}
  .pub-cover-bg{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:blur(18px) brightness(.55);transform:scale(1.12);}
  .pub-cover-bg.no-image{background:radial-gradient(circle at 50% 35%,#3c3c3a,#0a0a0a 75%);}
  .pub-cover-bg video{width:100%;height:100%;object-fit:cover;}
  .pub-cover-dim{position:absolute;inset:0;background:rgba(0,0,0,.35);}
  .pub-cover-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px;}
  .pub-cover-kicker{font-family:var(--font-display);font-size:clamp(18px,3vw,26px);letter-spacing:.5px;
    text-shadow:0 2px 14px rgba(0,0,0,.6);}
  .pub-cover-playbtn{width:94px;height:94px;border-radius:50%;border:3px solid rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);
    box-shadow:0 0 0 0 rgba(255,255,255,.35);animation:pubCoverPulse 2s ease-out infinite;}
  .pub-cover-playbtn svg{width:36px;height:36px;fill:#fff;margin-left:4px;}
  @keyframes pubCoverPulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,.35);}
    70%{box-shadow:0 0 0 22px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }
  .pub-cover-sub{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ddd;
    text-shadow:0 2px 10px rgba(0,0,0,.6);}

  /* ===================== CONTROLES PROFISSIONAIS (VOLUME + QUALIDADE) ===================== */
  .yt-quality-wrap{position:relative;}
  .yt-quality-btn{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center;}
  .yt-quality-btn svg{width:19px;height:19px;}
  .yt-quality-menu{position:absolute;bottom:32px;right:0;background:#181818;border:1px solid #333;border-radius:8px;
    padding:6px;display:none;min-width:140px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .yt-quality-menu.open{display:block;}
  .yt-quality-menu .yq-title{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    color:#888;padding:6px 10px 4px;}
  .yt-quality-menu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#fff;
    font-size:12.5px;padding:7px 10px;text-align:left;border-radius:5px;cursor:pointer;}
  .yt-quality-menu button:hover{background:rgba(255,255,255,.1);}
  .yt-quality-menu button .yq-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid #777;flex-shrink:0;}
  .yt-quality-menu button.sel .yq-dot{border-color:var(--red);background:var(--red);}
  .yt-quality-menu button.sel{color:var(--red);}

  /* ===================== TEMA CLARO DA SALA ===================== */
  html[data-pub-theme="claro"] body{background:#eef1f5;}
  html[data-pub-theme="claro"] .public-page{background:#eef1f5;}
  html[data-pub-theme="claro"] .pub-topbar{background:#fff;border-bottom:1px solid #e5e7eb;}
  html[data-pub-theme="claro"] .pub-title{color:#111827;}
  html[data-pub-theme="claro"] .pub-main{background:#eef1f5;}
  html[data-pub-theme="claro"] .pub-wrap{background:#eef1f5;}
  html[data-pub-theme="claro"] .pub-video{background:#000;box-shadow:0 1px 0 #e5e7eb;}
  html[data-pub-theme="claro"] .pub-side{background:#fff;border-left:1px solid #e5e7eb;}
  html[data-pub-theme="claro"] .pub-tabs{background:#f3f4f6;border:1px solid #e9eaec;border-radius:999px;
    padding:3px;margin:12px 14px 0;gap:3px;border-bottom:none;width:auto;}
  html[data-pub-theme="claro"] .pub-tab{border-radius:999px;border-bottom:none;color:#6b7280;font-size:12.5px;}
  html[data-pub-theme="claro"] .pub-tab.active{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  html[data-pub-theme="claro"] .pub-msgs{background:#fff;}
  html[data-pub-theme="claro"] .pub-chat-msg{color:#1f2937;}
  html[data-pub-theme="claro"] .pub-chat-msg .name{color:#6b7280;}
  html[data-pub-theme="claro"] .pub-chat-msg.mine{color:#2563eb;}
  html[data-pub-theme="claro"] .pub-input-row{background:#fff;border-top:1px solid #e5e7eb;}
  html[data-pub-theme="claro"] .pub-input-row .input{background:#f3f4f6;border:1px solid #e5e7eb;color:#111827;
    border-radius:999px;}
  html[data-pub-theme="claro"] .pub-input-row .btn-primary{background:#111827;border-color:#111827;color:#fff;
    border-radius:999px;}
  html[data-pub-theme="claro"] .pub-replay-note{color:#9ca3af;}
  html[data-pub-theme="claro"] .pub-badges{color:#9ca3af;background:#fff;border-top:1px solid #e5e7eb;}
  html[data-pub-theme="claro"] .pub-main::-webkit-scrollbar-track{background:#eef1f5;}
  html[data-pub-theme="claro"] .pub-main::-webkit-scrollbar-thumb{background:#d1d5db;}
  html[data-pub-theme="claro"] .pub-msgs::-webkit-scrollbar-track{background:#fff;}
  html[data-pub-theme="claro"] .pub-msgs::-webkit-scrollbar-thumb{background:#d1d5db;}

  .pub-replay-note{padding:14px;text-align:center;font-size:12px;color:var(--text-faint);border-top:1px solid var(--border-soft);}

  @media (max-width:900px){
    .pub-badges{display:none !important;}
  }
</style>
</head>
<body data-theme="dark">

<div class="sala-loading" id="salaLoading">Carregando sala...</div>

<div class="sala-error" id="salaError" style="display:none;"></div>

<div class="reg-screen" id="regScreen">
  <form class="reg-card" onsubmit="return false;">
    <div class="reg-logo">W</div>
    <div class="reg-badge" id="regBadge" style="display:none;"></div>
    <div class="reg-title" id="regTitle">Aula ao vivo</div>
    <div class="reg-sub" id="regSub">Preencha seus dados para entrar na sala</div>
    <div class="reg-field"><label>Nome</label><input class="input" id="regNome" style="width:100%;"></div>
    <div class="reg-field"><label>E-mail</label><input class="input" id="regEmail" type="email" style="width:100%;"></div>
    <div class="reg-field" id="regWhatsField" style="display:none;"><label>WhatsApp</label><input class="input" id="regWhats" style="width:100%;"></div>
    <div class="reg-field" id="regEmpresaField" style="display:none;"><label>Empresa</label><input class="input" id="regEmpresa" style="width:100%;"></div>
    <div id="regError" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none;"></div>
    <button type="button" class="btn btn-primary" id="regSubmitBtn" style="width:100%;justify-content:center;" onclick="Sala.register()">Entrar na Aula</button>
  </form>
</div>

<div class="public-page open" id="publicPage" style="display:none;">
  <div class="pub-topbar" id="pubTopbar">
    <b style="font-family:var(--font-display);font-size:13px;color:var(--yellow);">⚡ WebnarPRO</b>
  </div>
  <div class="pub-wrap">
    <div class="pub-main">
      <h1 class="pub-title" id="pubTitle">Aula ao vivo</h1>
      <div class="pub-video-wrap">
      <div class="pub-video" id="pubVideo"></div>
      <div class="pub-video-badges" id="pubVideoBadges">
        <span class="pub-live-pill" id="pubLivePill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8.5 15.5a5 5 0 010-7M15.5 15.5a5 5 0 000-7M5.3 18.7a9 9 0 010-13.4M18.7 18.7a9 9 0 000-13.4"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg>
          AO VIVO
        </span>
        <span class="pub-viewer-pill" id="audienceLiveBadge" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.7"/></svg>
          <span id="audienceLiveCount">0</span>
        </span>
      </div>
      </div>
    </div>
    <div class="pub-side" id="pubSide">
      <div class="pub-chat-head">
        <div>
          <div class="pub-chat-title">Chat ao vivo</div>
          <div class="pub-chat-sub">Mensagens</div>
        </div>
        <div class="pub-chat-meta">
          <span class="pub-chat-viewers">7,1 mil</span>
          <button type="button" title="Ajustes">☷</button>
          <button type="button" title="Fechar">×</button>
        </div>
      </div>
      <button type="button" class="reopen-checkout-btn" id="reopenCheckoutBtn" onclick="Sala.reopenCheckout()">🛒 Inscreva-se agora</button>
      <div class="pub-tabs">
        <button class="pub-tab active" id="tabChat" onclick="Sala.tab('chat')">Chat</button>
        <button class="pub-tab" id="tabSuporte" onclick="Sala.tab('suporte')">Suporte</button>
        <button class="pub-tab" id="tabOferta" onclick="Sala.tab('oferta')" style="display:none;">Oferta</button>
      </div>
      <div class="pub-msgs" id="pubMsgsChat"></div>
      <div class="pub-msgs" id="pubMsgsSuporte" style="display:none;"></div>
      <div class="pub-input-row">
        <input class="input" id="pubInput" placeholder="Digite algo..." style="flex:1;" onkeydown="if(event.key==='Enter')Sala.send()">
        <div class="pub-like-wrap" id="pubLikeWrap">
          <div class="pub-like-menu" id="pubLikeMenu">
            <button type="button" onclick="Sala.sendReaction('❤️')">❤️</button>
            <button type="button" onclick="Sala.sendReaction('😄')">😄</button>
            <button type="button" onclick="Sala.sendReaction('🎉')">🎉</button>
            <button type="button" onclick="Sala.sendReaction('😮')">😮</button>
            <button type="button" onclick="Sala.sendReaction('💯')">💯</button>
          </div>
          <button type="button" class="pub-like-btn" id="pubLikeBtn" onclick="Sala.toggleReactionMenu()" title="Reagir">❤</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="Sala.send()">Enviar</button>
      </div>
      <div class="pub-replay-note" id="pubReplayNote" style="display:none;">Comentários desativados...</div>
    </div>
  </div>
  <div class="pub-badges">
    <span>🔒 Site seguro</span><span>🛡️ Privacidade protegida</span>
  </div>
</div>

<div class="sale-toast" id="saleToast"></div>

<div class="offer-overlay" id="offerOverlay">
  <div class="offer-pip" id="offerPipWrap" onclick="Sala.closeOfferOverlay(true)" title="Voltar para o vídeo ao vivo"></div>
  <div class="offer-panel" id="offerPanelWrap"></div>
  <button type="button" class="offer-close-btn" onclick="Sala.closeOfferOverlay(true)">×</button>
</div>

<script src="/js/sala.js?v=17"></script>
</body>
</html>
