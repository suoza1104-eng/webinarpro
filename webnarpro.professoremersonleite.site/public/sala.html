<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebnarPRO — Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
<style>
  body{background:var(--bg);}
  .sala-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;}
  .sala-error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;text-align:center;padding:20px;}
  .reg-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:999;padding:16px;}
  .reg-screen.open{display:flex;}
  .reg-card{width:100%;max-width:380px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:32px 28px;text-align:center;}
  .reg-logo{width:52px;height:52px;border-radius:12px;background:var(--yellow);color:#0a0a0a;font-family:var(--font-display);font-size:22px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .reg-title{font-family:var(--font-display);font-size:17px;margin-bottom:4px;}
  .reg-sub{color:var(--text-dim);font-size:12.5px;margin-bottom:22px;}
  .reg-field{margin-bottom:12px;text-align:left;}
  .reg-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .reg-badge{background:var(--bg-elev-3);border-radius:6px;padding:8px 12px;font-size:10.5px;font-weight:700;color:var(--text-dim);margin-bottom:16px;}
  .sale-toast{position:fixed;left:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .sale-toast .sale-item{animation:saleIn .25s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  @keyframes saleIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body data-theme="dark">

<div class="sala-loading" id="salaLoading">Carregando sala...</div>

<div class="sala-error" id="salaError" style="display:none;"></div>

<div class="reg-screen" id="regScreen">
  <form class="reg-card" onsubmit="return false;">
    <div class="reg-logo">W</div>
    <div class="reg-badge" id="regBadge" style="display:none;"></div>
    <div class="reg-title" id="regTitle">Aula ao vivo</div>
    <div class="reg-sub" id="regSub">Preencha seus dados para entrar na sala</div>
    <div class="reg-field"><label>Nome</label><input class="input" id="regNome" style="width:100%;"></div>
    <div class="reg-field"><label>E-mail</label><input class="input" id="regEmail" type="email" style="width:100%;"></div>
    <div class="reg-field" id="regWhatsField" style="display:none;"><label>WhatsApp</label><input class="input" id="regWhats" style="width:100%;"></div>
    <div class="reg-field" id="regEmpresaField" style="display:none;"><label>Empresa</label><input class="input" id="regEmpresa" style="width:100%;"></div>
    <div id="regError" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none;"></div>
    <button type="button" class="btn btn-primary" id="regSubmitBtn" style="width:100%;justify-content:center;" onclick="Sala.register()">Entrar na Aula</button>
  </form>
</div>

<div class="public-page open" id="publicPage" style="display:none;">
  <div class="pub-topbar">
    <b style="font-family:var(--font-display);font-size:13px;color:var(--yellow);">⚡ WebnarPRO</b>
  </div>
  <div class="pub-wrap">
    <div class="pub-main">
      <h1 class="pub-title" id="pubTitle">Aula ao vivo</h1>
      <div class="pub-video" id="pubVideo"></div>
      <div class="pub-badges">
        <span>🔒 Site seguro</span><span>🛡️ Privacidade protegida</span>
      </div>
    </div>
    <div class="pub-side">
      <div class="pub-tabs">
        <button class="pub-tab active" id="tabChat" onclick="Sala.tab('chat')">Chat</button>
        <button class="pub-tab" id="tabSuporte" onclick="Sala.tab('suporte')">Suporte</button>
      </div>
      <div class="pub-msgs" id="pubMsgsChat"></div>
      <div class="pub-msgs" id="pubMsgsSuporte" style="display:none;"></div>
      <div class="pub-input-row">
        <input class="input" id="pubInput" placeholder="Digite algo..." style="flex:1;" onkeydown="if(event.key==='Enter')Sala.send()">
        <button class="btn btn-primary btn-sm" onclick="Sala.send()">Enviar</button>
      </div>
    </div>
  </div>
</div>

<div class="sale-toast" id="saleToast"></div>

<script src="js/sala.js"></script>
</body>
</html>
