# Item 1.4 do PLANO_OTIMIZACAO_ESCALA.md - cache dos assets estaticos do checkout E4Pay.
# Instalado em /etc/apache2/conf.d/userdata/ssl/2_4/professoremerson/e4pay.professoremersonleite.site/
# (o cPanel inclui todos os *.conf dessa pasta no vhost; vale com apachectl graceful).
# Na live de 21/10 o icons.svg sozinho teve centenas de hits em minutos - com cache, quem
# abre o checkout de novo nao baixa tudo outra vez. So imagens e fontes: JS e CSS ficam como o
# E4Pay manda (no-cache) porque nao tem versao no nome e uma atualizacao do checkout precisa
# chegar na hora.
<IfModule mod_headers.c>
  <LocationMatch "^/assets/.*\.(svg|png|jpe?g|webp|gif|ico|woff2?)$">
    Header set Cache-Control "public, max-age=3600"
  </LocationMatch>
</IfModule>
